[profile.default]
# Escrow 10 — ledger reconciliation fixture generator + reconciler.
src = "src"
test = "test"
out = "out"
libs = ["lib"]
cache_path = "cache"
fs_permissions = [{ access = "read-write", path = "./fixture" }]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

solc = "0.8.29"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = true
auto_detect_solc = false

[invariant]
runs = 1000
depth = 100
fail_on_revert = false

[fuzz]
runs = 256
seed = "0x20261008"
